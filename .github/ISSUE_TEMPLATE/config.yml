# Blank issues stay enabled on purpose: bug reports, questions and small
# observations should not have to go through a form. Only the feature/idea path
# is templated, because that is where borrowed ideas arrive and where duplicates
# have actually happened.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/Masashi-Ono0611/cipher-brain/security/advisories/new
    about: Do NOT open a public issue for a vulnerability — use private reporting (see SECURITY.md).
